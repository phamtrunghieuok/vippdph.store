<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vippdph.store — Apps</title>
  <meta name="description" content="Tải ứng dụng chất lượng từ vippdph.store" />
  <link rel="icon" href="/logo.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="/">
    <img src="/logo.png" alt="logo" class="nav-logo" />
    <span class="nav-name">vippdph.store</span>
  </a>
  <div class="nav-right">
    <span id="app-count" class="nav-link"></span>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Apps</h1>
    <p class="page-sub" id="sub-text">Đang tải...</p>
  </div>

  <div id="app-grid" class="app-grid">
    <!-- Skeleton cards -->
    <div class="app-card" style="opacity:0.4">
      <div class="card-top"><div class="app-icon-placeholder"></div><div class="card-meta"><div class="card-name" style="background:#222;height:14px;border-radius:4px;width:70%"></div></div></div>
    </div>
    <div class="app-card" style="opacity:0.3">
      <div class="card-top"><div class="app-icon-placeholder"></div><div class="card-meta"><div class="card-name" style="background:#222;height:14px;border-radius:4px;width:55%"></div></div></div>
    </div>
    <div class="app-card" style="opacity:0.2">
      <div class="card-top"><div class="app-icon-placeholder"></div><div class="card-meta"><div class="card-name" style="background:#222;height:14px;border-radius:4px;width:65%"></div></div></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script src="/main.js"></script>
</body>
</html>
